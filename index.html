<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MadiWay App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --orange: #FF6B00; --dark: #121212; --gray: #F5F7F9; }
        body { background: var(--gray); font-family: -apple-system, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        .page { display: none; animation: fadeIn 0.4s ease; padding-bottom: 30px; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Header dizayni */
        .header { background: white; padding: 30px 20px; border-radius: 0 0 35px 35px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .header h1 { font-size: 24px; margin: 0; font-weight: 800; width: 60%; }
        /* SIZ AYTGAN DAF FURA RASMI */
        .truck-header { position: absolute; right: -10px; bottom: 10px; width: 220px; z-index: 1; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15)); }

        .input-group { padding: 20px; }
        .p-input { width: 100%; padding: 18px; border-radius: 18px; border: 2px solid #EEE; background: white; font-size: 16px; outline: none; margin-bottom: 15px; }
        .p-input:focus { border-color: var(--orange); }

        .btn-main { width: 90%; margin: 0 5%; padding: 20px; border: none; border-radius: 20px; background: var(--orange); color: white; font-weight: 800; font-size: 18px; }

        /* Topic Grid */
        .topic-grid { padding: 20px; display: grid; gap: 12px; }
        .topic-card { background: white; padding: 20px; border-radius: 22px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .flag { font-size: 28px; margin-right: 15px; }
    </style>
</head>
<body>

    <!-- Kirish -->
    <div id="p-login" class="page active" style="padding: 50px 20px;">
        <h1 style="font-size: 30px;">Xush kelibsiz</h1>
        <p style="color: #666; margin-bottom: 30px;">Tizimga kirish uchun Face ID skaneridan o'ting.</p>
        <input type="text" id="u-name" class="p-input" placeholder="Ism Familiya">
        <input type="tel" id="u-phone" class="p-input" placeholder="+998 (__) ___-__-__">
        <button class="btn-main" onclick="openCam()">Davom etish 📸</button>
    </div>

    <!-- Face ID -->
    <div id="p-face" class="page" style="text-align: center; padding: 40px 20px;">
        <h2>Face ID Skaner</h2>
        <video id="video" style="width: 250px; height: 250px; border-radius: 50%; border: 4px solid var(--orange); object-fit: cover;" autoplay playsinline></video>
        <button class="btn-main" style="margin-top: 30px;" onclick="completeFace()">Skanerlash</button>
    </div>

    <!-- Asosiy (Topiclar) -->
    <div id="p-main" class="page">
        <div class="header">
            <h1>Yuk yo'nalishini tanlang</h1>
            <!-- SIZ AYTGAN DAF FURA RASMI -->
            <img src="https://i.postimg.cc/WbcqK7FF/daf-xf-daf-trucks-car-renault-magnum-car-removebg-preview.png" class="truck-header">
        </div>
        <div class="topic-grid">
            <div class="topic-card" onclick="goForm('Europe')"><span><span class="flag">🇪🇺</span><b>Europe</b></span> <span>🚀</span></div>
            <div class="topic-card" onclick="goForm('Rossiya')"><span><span class="flag">🇷🇺</span><b>Rossiya</b></span> <span>🚀</span></div>
            <div class="topic-card" onclick="goForm('Qirg\'iziston')"><span><span class="flag">🇰🇬</span><b>Qirg'iziston</b></span> <span>🚀</span></div>
            <div class="topic-card" onclick="goForm('Kazakistan')"><span><span class="flag">🇰🇿</span><b>Kazakistan</b></span> <span>🚀</span></div>
            <div class="topic-card" onclick="goForm('Eron')"><span><span class="flag">🇮🇷</span><b>Eron</b></span> <span>🚀</span></div>
            <div class="topic-card" onclick="goForm('Tojikston')"><span><span class="flag">🇹🇯</span><b>Tojikston</b></span> <span>🚀</span></div>
            <div class="topic-card" onclick="goForm('Germaniya')"><span><span class="flag">🇩🇪</span><b>Germaniya</b></span> <span>🚀</span></div>
            <div class="topic-card" onclick="goForm('Belarusiya')"><span><span class="flag">🇧🇾</span><b>Belarusiya</b></span> <span>🚀</span></div>
            <div class="topic-card" onclick="goForm('Gruziya')"><span><span class="flag">🇬🇪</span><b>Gruziya</b></span> <span>🚀</span></div>
            <div class="topic-card" onclick="goForm('Ukraina')"><span><span class="flag">🇺🇦</span><b>Ukraina</b></span> <span>🚀</span></div>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let currentTopic = "";

        // Telefon maskasi
        document.getElementById('u-phone').addEventListener('input', (e) => {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,2})(\d{0,3})(\d{0,2})(\d{0,2})/);
            e.target.value = !x[2] ? '+998 (' : '+998 (' + x[2] + (x[3] ? ') ' + x[3] : '') + (x[4] ? '-' + x[4] : '') + (x[5] ? '-' + x[5] : '');
        });

        async function openCam() {
            const s = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('video').srcObject = s;
            showPage('p-face');
        }

        function completeFace() {
            // Rasmga olish va botga yuborish logikasi shu yerda
            showPage('p-main');
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goForm(topic) {
            alert(topic + " uchun yuk joylash tanlandi!");
        }
    </script>
</body>
</html>
