<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MadiWay Pro v11</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/inputmask@5.0.7/dist/inputmask.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --orange: #FF6B00; --bg: #F8F9FB; --gray: #8E8E93; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'SF Pro Display', sans-serif; }
        body { background: var(--bg); }

        .page { display: none; padding-bottom: 100px; animation: fadeIn 0.3s; }
        .active { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Banner & Buttons */
        .promo { padding: 20px; position: relative; background: white; }
        .truck-img { position: absolute; right: -10px; bottom: 0; width: 160px; }
        
        .channel-btn { 
            margin: 15px 20px; padding: 12px; background: #0088cc; color: white; 
            border-radius: 12px; display: flex; align-items: center; justify-content: center; 
            gap: 10px; text-decoration: none; font-weight: 600; font-size: 14px;
        }

        /* Topic List */
        .topic-list { padding: 10px 20px; }
        .topic-card { 
            background: white; padding: 18px; border-radius: 18px; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid #F0F0F0; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .count { background: #FF6B0015; color: var(--orange); padding: 4px 10px; border-radius: 10px; font-weight: 800; }

        /* Inputs & Modals */
        .input { width: 100%; padding: 16px; border-radius: 14px; border: 1px solid #DDD; margin: 8px 0; outline: none; }
        .btn-orange { width: 100%; padding: 18px; border-radius: 16px; border: none; background: var(--orange); color: white; font-weight: 700; cursor: pointer; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 1000; padding: 20px; }
        .modal-content { background: white; border-radius: 25px; padding: 25px; margin-top: 30%; }
    </style>
</head>
<body>

<div id="p-login" class="page active">
    <div style="padding: 60px 25px; text-align: center;">
        <h1 style="color:var(--orange); font-size: 40px;">MadiWay</h1>
        <div id="v-cont" style="width:150px; height:150px; border-radius:50%; border:4px solid var(--orange); margin:20px auto; overflow:hidden; display:none;">
            <video id="video" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
        </div>
        <input type="text" id="u-name" class="input" placeholder="Ism Familiya">
        <input type="tel" id="u-phone" class="input" placeholder="+998 (__) ___-__-__">
        <button class="btn-orange" onclick="startAuth()">Face ID bilan kirish</button>
    </div>
</div>

<div id="p-main" class="page">
    <div style="padding:15px 20px; background:white; display:flex; justify-content:space-between; align-items:center;">
        <b id="user-display">...</b>
        <i class="fa-regular fa-bell"></i>
    </div>

    <div class="promo">
        <h2 style="font-size:24px;">Tezkor va ishonchli</h2>
        <p style="color:var(--gray)">Yukingizni xavfsiz yetkazamiz.</p>
        <img src="https://i.postimg.cc/WbcqK7FF/daf-xf-daf-trucks-car-renault-magnum-car-removebg-preview.png" class="truck-img">
    </div>

    <!-- Kanalga yuborish tugmasi -->
    <a href="https://t.me/MADIWAY_Gr" class="channel-btn">
        <i class="fa-brands fa-telegram"></i> Rasmiy guruhga o'tish
    </a>

    <div class="topic-list" id="list"></div>
</div>

<div id="m" class="modal">
    <div class="modal-content">
        <h3 id="mt">...</h3>
        <textarea id="desc" class="input" rows="4" placeholder="Yuk tavsifi..."></textarea>
        <button class="btn-orange" onclick="send()">Guruhga yuborish</button>
        <button onclick="document.getElementById('m').style.display='none'" style="width:100%; margin-top:10px; border:none; background:none; color:var(--gray)">Bekor qilish</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    Inputmask({"mask": "+998 (99) 999-99-99"}).mask(document.getElementById('u-phone'));

    const topics = [
        { n: "Europa", id: 2 }, { n: "Rossiya", id: 4 }, { n: "Qirg'iziston", id: 6 },
        { n: "Kazakistan", id: 8 }, { n: "Eron", id: 10 }, { n: "Tojikston", id: 12 },
        { n: "Germaniya", id: 14 }, { n: "Belarus", id: 16 }, { n: "Gruziya", id: 18 }, { n: "Ukraina", id: 20 }
    ];

    let currentTid = 0;

    async function startAuth() {
        const n = document.getElementById('u-name').value;
        const p = document.getElementById('u-phone').value;
        if(n.split(' ').length < 2 || !Inputmask.isValid(p, {"mask": "+998 (99) 999-99-99"})) return tg.showAlert("Ma'lumotlarni to'liq kiriting!");

        document.getElementById('v-cont').style.display = 'block';
        const s = await navigator.mediaDevices.getUserMedia({video:true});
        document.getElementById('video').srcObject = s;
        setTimeout(() => {
            s.getTracks().forEach(t => t.stop());
            localStorage.setItem('madi_user', JSON.stringify({n, p}));
            location.reload();
        }, 2500);
    }

    function render() {
        document.getElementById('list').innerHTML = topics.map(t => `
            <div class="topic-card" onclick="openM(${t.id},'${t.n}')">
                <span>${t.n}</span>
                <span class="count">Faol</span>
            </div>
        `).join('');
    }

    function openM(id, n) { currentTid = id; document.getElementById('mt').innerText = n; document.getElementById('m').style.display='block'; }

    function send() {
        const d = document.getElementById('desc').value;
        if(!d) return tg.showAlert("Tavsif yozing!");
        const u = JSON.parse(localStorage.getItem('madi_user'));
        
        // MUHIM: Ma'lumotni JSON ko'rinishida yuborish
        tg.sendData(JSON.stringify({
            t_id: currentTid,
            text: d,
            user: u.n,
            phone: u.p
        }));
    }

    window.onload = () => {
        const u = localStorage.getItem('madi_user');
        if(u) {
            document.getElementById('p-login').classList.remove('active');
            document.getElementById('p-main').classList.add('active');
            document.getElementById('user-display').innerText = JSON.parse(u).n;
            render();
        }
    };
</script>
</body>
</html>
