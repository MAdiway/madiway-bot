<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MadiWay Logistics</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/inputmask@5.0.7/dist/inputmask.min.js"></script>
    <style>
        :root { --orange: #FF6B00; --bg: #F2F2F7; }
        body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        .banner { width: 100%; height: 160px; overflow: hidden; position: relative; background: #fff; border-bottom: 2px solid var(--orange); }
        .banner img { width: 100%; height: 100%; object-fit: contain; }
        .container { padding: 15px; }
        .page { display: none; }
        .active { display: block; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; border: 1px solid #ddd; cursor: pointer; }
        .input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; margin: 10px 0; font-size: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; color: white; cursor: pointer; font-size: 16px; }
        .btn-orange { background: var(--orange); }
        .btn-blue { background: #0088cc; margin-top: 10px; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        .modal-content { background: white; border-radius: 20px; padding: 20px; margin: 20% 15px; }
    </style>
</head>
<body>

<!-- Ilova ichidagi rasm -->
<div class="banner">
    <img src="https://i.postimg.cc/WbcqK7FF/daf-xf-daf-trucks-car-renault-magnum-car-removebg-preview.png" alt="MadiWay Truck">
</div>

<div class="container">
    <div id="p-login" class="page active">
        <h2 style="text-align: center; color: var(--orange);">Kirish</h2>
        <input type="text" id="u-name" class="input" placeholder="Ism Familiya">
        <input type="tel" id="u-phone" class="input" placeholder="+998 (__) ___-__-__">
        <button class="btn btn-orange" onclick="auth()">Davom etish</button>
    </div>

    <div id="p-main" class="page">
        <h3 id="welcome-text">Yo'nalishni tanlang:</h3>
        <div id="list"></div>
    </div>
</div>

<div id="mod" class="modal">
    <div class="modal-content">
        <h3 id="mt">Yo'nalish</h3>
        <textarea id="desc" class="input" rows="3" placeholder="Yuk haqida ma'lumot (masalan: 20 tonna olma)"></textarea>
        <div style="margin: 10px 0;">
            <input type="checkbox" id="now" checked onchange="document.getElementById('time').disabled = this.checked">
            <label for="now">Tezkor (Hozir)</label>
        </div>
        <input type="time" id="time" class="input" disabled>
        <button class="btn btn-orange" onclick="sendData('group')">Guruhga yuborish</button>
        <button class="btn btn-blue" onclick="sendData('channel')">Kanalga yuborish</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:10px; color:gray;">Bekor qilish</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    Inputmask({"mask": "+998 (99) 999-99-99"}).mask(document.getElementById('u-phone'));

    const topics = [
        {n:"Rossiya", id:4}, {n:"Europa", id:2}, {n:"Ozarbayjon", id:6}, {n:"Kazakistan", id:8},
        {n:"Eron", id:10}, {n:"Tojikston", id:12}, {n:"Germaniya", id:14}, {n:"O'zbekiston", id:16}
    ];

    let selectedId = 0, selectedName = "";

    function auth() {
        const n = document.getElementById('u-name').value;
        const p = document.getElementById('u-phone').value;
        if(n.length < 3 || p.includes('_')) return alert("Ma'lumotlarni to'liq kiriting!");
        localStorage.setItem('mw_user', JSON.stringify({n, p}));
        showMain();
    }

    function showMain() {
        document.getElementById('p-login').classList.remove('active');
        document.getElementById('p-main').classList.add('active');
        const user = JSON.parse(localStorage.getItem('mw_user'));
        document.getElementById('welcome-text').innerText = "Salom, " + user.n.split(' ')[0] + "! Yo'nalishni tanlang:";
        renderList();
    }

    function renderList() {
        const html = topics.map(t => `
            <div class="card" onclick="openModal(${t.id}, '${t.n}')">
                <b>${t.n}</b> <span>➔</span>
            </div>
        `).join('');
        document.getElementById('list').innerHTML = html;
    }

    function openModal(id, n) {
        selectedId = id; selectedName = n;
        document.getElementById('mt').innerText = n + " yo'nalishi";
        document.getElementById('mod').style.display = 'block';
    }

    function closeModal() { document.getElementById('mod').style.display = 'none'; }

    function sendData(target) {
        const desc = document.getElementById('desc').value;
        const isNow = document.getElementById('now').checked;
        const time = isNow ? "Hozir" : document.getElementById('time').value;
        if(!desc) return alert("Yuk haqida yozing!");

        const user = JSON.parse(localStorage.getItem('mw_user'));
        const payload = {
            target: target,
            t_id: selectedId,
            t_name: selectedName,
            desc: desc,
            time: time,
            u_name: user.n,
            u_phone: user.p
        };

        // Telegramga ma'lumotni yuborish
        tg.sendData(JSON.stringify(payload));
        tg.close(); // Ilovani yopish
    }

    window.onload = () => {
        if(localStorage.getItem('mw_user')) showMain();
    };
</script>
</body>
</html>
