<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MadiWay Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --orange: #FF6B00; --dark: #1A1A1A; --gray: #F4F7F6; }
        body { background: var(--gray); font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }

        .page { display: none; animation: slideUp 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Header yangi fura bilan */
        .header { background: white; padding: 30px 20px; border-radius: 0 0 35px 35px; position: relative; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .header h1 { font-size: 24px; margin: 0; color: var(--dark); width: 60%; }
        .new-truck { position: absolute; right: -10px; bottom: 5px; width: 200px; z-index: 1; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); }

        /* Form elementlari */
        .card { background: white; margin: 15px; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .p-input { width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid #EEE; margin-bottom: 12px; font-size: 16px; outline: none; }
        .p-input:focus { border-color: var(--orange); }

        /* Face ID Skaner */
        .face-box { width: 220px; height: 220px; margin: 20px auto; border-radius: 50%; border: 3px solid var(--orange); overflow: hidden; position: relative; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scan-bar { position: absolute; width: 100%; height: 3px; background: var(--orange); top: 0; animation: scan 2s infinite linear; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .btn { width: 100%; padding: 18px; border: none; border-radius: 15px; background: var(--orange); color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        /* Topic List */
        .topic-item { background: white; padding: 18px; margin: 10px 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <!-- Login -->
    <div id="login-page" class="page active" style="padding: 40px 20px;">
        <h2>Kirish</h2>
        <input type="text" id="name" class="p-input" placeholder="Ism Familiya">
        <input type="tel" id="phone" class="p-input" placeholder="+998 (__) ___-__-__">
        <button class="btn" onclick="openCam()">Davom etish 📸</button>
    </div>

    <!-- Face ID -->
    <div id="face-page" class="page" style="text-align: center; padding: 40px 20px;">
        <h3>Yuzingizni skanerlang</h3>
        <div class="face-box"><video id="video" autoplay playsinline></video><div class="scan-bar"></div></div>
        <button class="btn" onclick="doneAuth()">Tasdiqlash</button>
    </div>

    <!-- Main -->
    <div id="main-page" class="page">
        <div class="header">
            <h1>Qayerga yuk yuboramiz?</h1>
            <!-- YANGI FURA RASMI INDEXDA -->
            <img src="https://madiway.github.io/madiway-bot/truck_transparent.png" class="new-truck">
        </div>
        <div style="margin-top: 20px;" id="topics">
            <!-- Topiclar ro'yxati -->
            <div class="topic-item" onclick="goForm('Europe')">Europe 🇪🇺 <span>▶️</span></div>
            <div class="topic-item" onclick="goForm('Rossiya')">Rossiya 🇷🇺 <span>▶️</span></div>
            <div class="topic-item" onclick="goForm('Qirg\'iziston')">Qirg'iziston 🇰🇬 <span>▶️</span></div>
            <div class="topic-item" onclick="goForm('Kazakistan')">Kazakistan 🇰🇿 <span>▶️</span></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let currentTopic = "";

        // Telefon maskasi
        document.getElementById('phone').addEventListener('input', (e) => {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,2})(\d{0,3})(\d{0,2})(\d{0,2})/);
            e.target.value = !x[2] ? '+998 (' : '+998 (' + x[2] + (x[3] ? ') ' + x[3] : '') + (x[4] ? '-' + x[4] : '') + (x[5] ? '-' + x[5] : '');
        });

        async function openCam() {
            const s = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('video').srcObject = s;
            document.getElementById('login-page').classList.remove('active');
            document.getElementById('face-page').classList.add('active');
        }

        function doneAuth() {
            document.getElementById('face-page').classList.remove('active');
            document.getElementById('main-page').classList.add('active');
        }

        function goForm(t) {
            currentTopic = t;
            // Bu yerda yuk joylash formasini ochish mumkin
            alert(t + " uchun yuk joylash!");
        }
    </script>
</body>
</html>
